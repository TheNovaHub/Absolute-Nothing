
name: Unpack ZIP

on:
  workflow_dispatch:

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP files
        run: |
          mkdir -p unpacked

          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Unpacking: $file"
              unzip -o "$file" -d unpacked/
            fi
          done

      - name: Upload unpacked files
        uses: actions/upload-artifact@v4
        with:
          name: unpacked-files
          path: unpacked/
          if-no-files-found: error
