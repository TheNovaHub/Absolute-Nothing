
name: Unpack project.zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          if [ ! -f "project.zip" ]; then
            echo "ERROR: project.zip not found!"
            exit 1
          fi

          echo "Unpacking project.zip..."

          unzip -o project.zip -d .

          echo "ZIP successfully extracted."

      - name: Remove ZIP
        run: |
          rm -f project.zip
          echo "project.zip removed."

      - name: Commit and Push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          # Do not push .github directory
          git reset -- .github/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract project.zip"
            git push
          fi
